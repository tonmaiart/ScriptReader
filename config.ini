[defaults]
target_folder = /home/tomatactics/.config/blender/5.1/extensions/user_default/SuperSkinPro

[ignore]
patterns = .git, __pycache__, node_modules, venv, .venv, build_all.py, rust_logic/target

[extensions]
supported = .txt, .md, .csv, .ini, .toml, .py, .rs, .json, .sh

[main_list_keywords]
# Match by filename (basename only) — applies to any file anywhere in the project
# Example: __init__.py will match every __init__.py regardless of folder
keywords = CLAUDE.md

[main_list_paths]
# Match by relative path prefix — a folder name includes all files inside it
# Example: docs  will include every file under docs/
paths = __init__.py,docs/core-interfaces,docs/domains